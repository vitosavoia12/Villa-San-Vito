<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raito, Costiera Amalfitana</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    >
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #e9eee9;
        color: #173b3d;
        font-family: Arial, sans-serif;
      }

      .area-label {
        position: absolute;
        z-index: 500;
        top: 1rem;
        left: 1rem;
        max-width: calc(100% - 5rem);
        border: 1px solid rgba(23, 59, 61, 0.18);
        border-radius: 4px;
        background: rgba(255, 253, 248, 0.94);
        padding: 0.7rem 0.85rem;
        box-shadow: 0 5px 18px rgba(23, 59, 61, 0.1);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .leaflet-control-attribution {
        font-size: 9px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Mappa generale di Raito e della Costiera Amalfitana"></div>
    <div class="area-label">Raito · Costiera Amalfitana</div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script>
      const map = L.map("map", {
        attributionControl: true,
        scrollWheelZoom: false,
        zoomControl: true
      });

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
        {
          attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
          subdomains: "abcd",
          maxZoom: 19
        }
      ).addTo(map);

      map.fitBounds(
        [
          [40.626, 14.64],
          [40.715, 14.79]
        ],
        { padding: [20, 20] }
      );
    </script>
  </body>
</html>
